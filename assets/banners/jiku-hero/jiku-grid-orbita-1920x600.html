<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  :root{
    --ink:#111318;
    --gray:#5b6472;
    --blue-100:#e9f2fc;
    --blue-200:#cfe3f9;
    --blue-300:#7fb8f0;
    --blue-500:#2e7cd6;
    --blue-700:#1d4fa8;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1920px;height:600px;overflow:hidden;background:#ffffff;
    font-family:'Poppins',sans-serif;position:relative}

  .grid{position:absolute;inset:0;
    background-image:
      linear-gradient(to right, rgba(46,124,214,.07) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(46,124,214,.07) 1px, transparent 1px);
    background-size:80px 80px}
  .grid::after{content:'';position:absolute;inset:0;
    background:radial-gradient(ellipse at 28% 50%, rgba(255,255,255,0) 15%, #fff 85%)}

  .logo{position:absolute;left:120px;top:48px;width:300px;height:120px;
    background-image:url('logo-oficial.png');
    background-size:600px 600px;background-position:-174px -234px;background-repeat:no-repeat}

  .content{position:absolute;left:140px;top:58%;transform:translateY(-50%);max-width:840px;z-index:3}
  .eyebrow{font-size:19px;font-weight:600;color:var(--blue-500);
    letter-spacing:.28em;text-transform:uppercase;margin-bottom:24px}
  h1{font-size:74px;font-weight:700;line-height:1.06;letter-spacing:-0.01em;color:var(--ink)}
  h1 span{color:var(--blue-500)}
  .desc{font-size:23px;color:var(--gray);margin-top:22px;line-height:1.6;max-width:640px;font-weight:400}
  .cta{display:inline-flex;align-items:center;gap:12px;margin-top:36px;
    background:var(--blue-700);color:#fff;font-weight:600;font-size:22px;
    padding:18px 42px;border-radius:10px;letter-spacing:.01em;
    box-shadow:0 12px 30px rgba(29,79,168,.25)}
  .cta svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;
    stroke-linecap:round;stroke-linejoin:round}

  /* orbital gear rings */
  svg.art{position:absolute;right:0;top:0;height:600px;z-index:2}
</style>
</head>
<body>
  <div class="grid"></div>

  <svg class="art" width="860" height="600" viewBox="0 0 860 600" fill="none">
    <!-- dashed orbits -->
    <circle cx="520" cy="300" r="250" stroke="#cfe3f9" stroke-width="1.5" stroke-dasharray="3 10"/>
    <circle cx="520" cy="300" r="180" stroke="#cfe3f9" stroke-width="1.5"/>
    <!-- gear arc segments (3 blues, rotating feel) -->
    <g stroke-linecap="round" fill="none">
      <path d="M520 90 A210 210 0 0 1 707 190" stroke="#7fb8f0" stroke-width="34"/>
      <path d="M730 300 A210 210 0 0 1 640 475" stroke="#2e7cd6" stroke-width="34"/>
      <path d="M520 510 A210 210 0 0 1 333 410" stroke="#1d4fa8" stroke-width="34"/>
      <path d="M310 300 A210 210 0 0 1 400 125" stroke="#2e7cd6" stroke-width="34" opacity=".45"/>
    </g>
    <!-- interlocked links center (logo motif) -->
    <g>
      <rect x="418" y="248" width="130" height="72" rx="36" stroke="#1d4fa8" stroke-width="22" transform="rotate(-18 483 284)"/>
      <rect x="492" y="280" width="130" height="72" rx="36" stroke="#2e7cd6" stroke-width="22" transform="rotate(-18 557 316)"/>
    </g>
    <!-- nodes -->
    <circle cx="707" cy="190" r="9" fill="#1d4fa8"/>
    <circle cx="333" cy="410" r="9" fill="#7fb8f0"/>
    <circle cx="770" cy="300" r="7" fill="#2e7cd6"/>
    <!-- accents -->
    <rect x="250" y="120" width="18" height="18" stroke="#7fb8f0" stroke-width="2"/>
    <rect x="790" y="470" width="13" height="13" fill="#cfe3f9"/>
    <text x="742" y="80" font-family="Poppins" font-size="15" letter-spacing="4" fill="#9db4cf">JIKU.01</text>
  </svg>

  <div class="logo"></div>

  <div class="content">
    <h1>Lleva tu negocio<br/><span>a la cima</span></h1>
    <p class="desc">Chatbots, redes sociales y procesos automatizados para negocios locales.</p>
    <span class="cta">Agenda tu consulta gratis
      <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </span>
  </div>
</body>
</html>
