<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  :root{
    --ink:#111318;
    --gray:#5b6472;
    --blue-100:#e9f2fc;
    --blue-200:#cfe3f9;
    --blue-300:#7fb8f0;
    --blue-500:#2e7cd6;
    --blue-700:#1d4fa8;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1920px;height:600px;overflow:hidden;background:#fff;
    font-family:'Poppins',sans-serif;position:relative}

  .dots{position:absolute;inset:0;
    background-image:radial-gradient(rgba(46,124,214,.16) 1.5px, transparent 1.5px);
    background-size:44px 44px}
  .dots::after{content:'';position:absolute;inset:0;
    background:linear-gradient(to right, #fff 0%, transparent 45%, transparent 72%, #fff 100%),
               linear-gradient(to top, transparent 55%, #fff 100%)}

  .logo{position:absolute;left:120px;top:48px;width:300px;height:120px;
    background-image:url('logo-oficial.png');
    background-size:600px 600px;background-position:-174px -234px;background-repeat:no-repeat}

  .content{position:absolute;left:140px;top:58%;transform:translateY(-50%);max-width:860px;z-index:5}
  .eyebrow{font-size:19px;font-weight:600;color:var(--blue-500);
    letter-spacing:.28em;text-transform:uppercase;margin-bottom:24px}
  h1{font-size:74px;font-weight:700;line-height:1.06;letter-spacing:-0.01em;color:var(--ink)}
  h1 span{color:var(--blue-500)}
  .desc{font-size:23px;color:var(--gray);margin-top:22px;line-height:1.6;max-width:640px}
  .cta{display:inline-flex;align-items:center;gap:12px;margin-top:36px;
    background:var(--blue-700);color:#fff;font-weight:600;font-size:22px;
    padding:18px 42px;border-radius:10px;box-shadow:0 12px 30px rgba(29,79,168,.25)}
  .cta svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;
    stroke-linecap:round;stroke-linejoin:round}

  .steps{position:absolute;right:120px;bottom:0;display:flex;align-items:flex-end;gap:22px;z-index:4}
  .step{width:112px;position:relative;border-radius:10px 10px 0 0}
  .s1{background:var(--blue-100)} .s2{background:var(--blue-200)}
  .s3{background:var(--blue-300)} .s4{background:var(--blue-500)}
  .step.hot{background:linear-gradient(to top, var(--blue-700), var(--blue-500))}
  .step .label{position:absolute;top:-36px;left:50%;transform:translateX(-50%);
    font-size:14.5px;font-weight:500;color:var(--gray);letter-spacing:.06em;white-space:nowrap}
  .s4 .label{color:var(--blue-700);font-weight:600}
  .step.hot .label{color:#fff;top:20px;font-weight:600}

  .flagline{position:absolute;right:176px;bottom:460px;z-index:4;width:2px;height:48px;background:var(--blue-700)}
  .flag{position:absolute;right:116px;bottom:508px;z-index:4;
    font-size:14px;font-weight:700;color:#fff;background:var(--blue-700);
    padding:6px 14px;letter-spacing:.18em;border-radius:6px}

  .baseline{position:absolute;left:0;right:0;bottom:0;height:1px;
    background:linear-gradient(to right, transparent, rgba(46,124,214,.4), transparent)}
</style>
</head>
<body>
  <div class="dots"></div>

  <div class="steps">
    <div class="step s1" style="height:120px"><span class="label">web</span></div>
    <div class="step s2" style="height:200px"><span class="label">redes</span></div>
    <div class="step s3" style="height:290px"><span class="label">chatbot 24/7</span></div>
    <div class="step s4" style="height:380px"><span class="label">procesos</span></div>
    <div class="step hot" style="height:460px"><span class="label">tu negocio</span></div>
  </div>
  <div class="flagline"></div>
  <div class="flag">CIMA</div>
  <div class="baseline"></div>

  <div class="logo"></div>

  <div class="content">
    <h1>Lleva tu negocio<br/><span>a la cima</span></h1>
    <p class="desc">Chatbots, redes sociales y procesos automatizados para negocios locales.</p>
    <span class="cta">Agenda tu consulta gratis
      <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </span>
  </div>
</body>
</html>
