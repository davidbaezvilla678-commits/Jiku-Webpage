<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 620" width="460" height="620" role="img" aria-label="Jiku Solutions">
  <defs>
    <linearGradient id="jikuGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2547ff"/>
      <stop offset="0.55" stop-color="#2f7bff"/>
      <stop offset="1" stop-color="#28d7ef"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;800&amp;display=swap');
      .wordmark { font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif; font-weight: 800; fill: #0d1b2a; }
      .tagline  { font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif; font-weight: 500; fill: #34435a; letter-spacing: 0.42em; }
    </style>
  </defs>

  <!-- Icon: monoline "J" mark -->
  <path d="M 197 95 L 292 95 L 292 250 Q 292 312 225 312 Q 170 312 162 258"
